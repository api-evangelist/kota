openapi: 3.2.0
info:
  title: Kota Webhooks API
  version: '1.0'
  description: 'Operations tagged webhooks across 2 of this provider''s published API definitions: kota-api-reference-openapi.json, kota-openapi-original.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://test.api.kota.io
  description: test
- url: https://api.kota.io
  description: production
tags:
- name: webhooks
paths:
  /webhooks/endpoints:
    get:
      operationId: list-webhook-endpoints
      summary: List all webhook endpoints
      description: Get all registered webhook endpoints for the platform.
      tags:
      - webhooks
      parameters:
      - name: page
        in: query
        description: The page of results to return. Defaults to 1 if not provided.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: The number of results to return per page. Defaults to 10 if not provided. Maximum value is 100.
        required: false
        schema:
          type: integer
      - name: Authorization
        in: header
        description: Authorization header using the Bearer scheme
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointResponsePagedList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
    servers:
    - url: https://test.api.kota.io
      description: test
    - url: https://api.kota.io
      description: production
  /webhooks/endpoints/{webhook_endpoint_id}:
    get:
      operationId: retrieve-webhook-endpoint
      summary: Retrieve a webhook endpoint
      description: Get a registered webhook endpoint by its Id.
      tags:
      - webhooks
      parameters:
      - name: webhook_endpoint_id
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Authorization header using the Bearer scheme
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    servers:
    - url: https://test.api.kota.io
      description: test
    - url: https://api.kota.io
      description: production
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      title: ProblemDetails
    WebhookEndpointResponsePagedList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointResponse'
          description: A paginated array containing the response elements
        page:
          type: integer
          description: The current page of the results
        page_size:
          type: integer
          description: The number of results on this page. This can be different from the requested page size if the total number of results is less than the requested page size
        total_count:
          type: integer
          description: The total number of elements available in the response. This is the total number of elements available across all pages, not just the current page.
        has_next_page:
          type: boolean
          description: Whether there are more pages available after this page
        has_previous_page:
          type: boolean
          description: Whether there are more pages available before this page
      required:
      - items
      - page
      - page_size
      - total_count
      title: WebhookEndpointResponsePagedList
    HttpValidationProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      title: HttpValidationProblemDetails
    WebhookEndpointResponse:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the endpoint
        endpoint_url:
          type: string
          description: The registered URL of the endpoint
        subscribed_events:
          type: array
          items:
            type: string
          description: The events the endpoint is subscribed to
        created_at:
          type: string
          format: date-time
          description: The date and time the endpoint was created
        object:
          type: string
          description: The object type
      required:
      - id
      - endpoint_url
      - subscribed_events
      - created_at
      title: WebhookEndpointResponse
    HttpValidationProblemDetails_2:
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          type:
          - 'null'
          - integer
          format: int32
        detail:
          type:
          - 'null'
          - string
        instance:
          type:
          - 'null'
          - string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: {}
    WebhookEndpointResponsePagedList_2:
      required:
      - items
      - page
      - page_size
      - total_count
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointResponse_2'
          description: A paginated array containing the response elements
        page:
          type: integer
          description: The current page of the results
          format: int32
          example: 123
        page_size:
          type: integer
          description: The number of results on this page. This can be different from the requested page size if the total number of results is less than the requested page size
          format: int32
          example: 123
        total_count:
          type: integer
          description: The total number of elements available in the response. This is the total number of elements available across all pages, not just the current page.
          format: int32
          example: 123
        has_next_page:
          type: boolean
          description: Whether there are more pages available after this page
          readOnly: true
          example: true
        has_previous_page:
          type: boolean
          description: Whether there are more pages available before this page
          readOnly: true
          example: true
      additionalProperties: false
    ProblemDetails_2:
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          type:
          - 'null'
          - integer
          format: int32
        detail:
          type:
          - 'null'
          - string
        instance:
          type:
          - 'null'
          - string
      additionalProperties: {}
    WebhookEndpointResponse_2:
      required:
      - created_at
      - endpoint_url
      - id
      - subscribed_events
      type: object
      properties:
        id:
          pattern: whe_.+
          type: string
          description: The unique identifier of the endpoint
          example: whe_3b1333d87d9d4fd6ad83ba7f6b0e951a
        endpoint_url:
          type: string
          description: The registered URL of the endpoint
        subscribed_events:
          type: array
          items:
            type: string
          description: The events the endpoint is subscribed to
        created_at:
          type: string
          description: The date and time the endpoint was created
          format: date-time
          example: '2024-12-01T00:00:00Z'
        object:
          type: string
          description: The object type
          readOnly: true
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Authorization header using the Bearer scheme
x-refined-from:
- kota-api-reference-openapi.json
- kota-openapi-original.json

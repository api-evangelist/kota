      - due_by
      title: DependentsManagementIntentActionRequiredResponse
    PolicyAmendmentIntentStatus:
      type: string
      enum:
      - action_required
      - awaiting_quote
      - pending_confirmation
      - processing
      - amended
      - processing_error
      - not_undertaken
      title: PolicyAmendmentIntentStatus
    Policy Amendment Intents_ConfirmPolicyAmendmentIntent_Response_204:
      type: object
      properties: {}
      description: Empty response body
      title: Policy Amendment Intents_ConfirmPolicyAmendmentIntent_Response_204
    DependentsManagementIntentActionCode:
      type: string

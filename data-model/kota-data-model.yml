  published Key Concepts model.
hierarchy: Platform -> Employers -> (Employees, Groups) -> Group Policies -> Policies
entities:
- name: Platform
  description: A customer platform (payroll, HR or EOR) integrating Kota to offer benefits.
  api_resource: null
- name: Employer
  description: A legal entity in a specific country that provides policies to its employees. Transitions
    pending -> active during regulatory checks.
  api_resource: /employers
- name: Employee
  description: An individual who receives policies from their employer; may have dependants.
  api_resource: /employees
- name: AssociatedPerson
  description: A dependant or beneficiary (spouse, partner, child) attached to an employee.
  api_resource: /employees/{employee_id}/associated_persons
- name: Group
  description: Unified abstraction for managing policies of one or more benefit types; may be a bundle.
  api_resource: /groups
- name: GroupPolicy
  description: The collective benefit configuration established by an employer at group level with a provider.
  api_resource: /group_policies
- name: Policy
  description: The individual benefit issued to an employee who enrols, derived from the group policy.
  api_resource: /policies
- name: Plan
  description: A benefit plan/product available from a provider.
  api_resource: /plans
- name: GroupQuoteIntent
  description: Intent that requests quotes for a group from providers.
  api_resource: /group_quote_intents
- name: GroupPolicyIntent
  description: Intent that establishes the group policy once a quote is selected.
  api_resource: /group_policy_intents
- name: EnrolmentIntent
  description: Intent that guides an eligible employee through enrolment and issues a Policy.
  api_resource: /enrolment_intents
- name: DependentsManagementIntent
  description: Intent for adding, removing and confirming dependants during enrolment or the cooling-off
    period.
  api_resource: /dependents_management_intents
- name: PolicyAmendmentIntent
  description: Intent for amending an issued policy.
  api_resource: /policies/{policy_id}/policy_amendment_intents
- name: PolicyImportIntent
  description: Intent for migrating an existing policy into Kota.
  api_resource: /policy_import_intents
- name: Requirement
  description: A dynamic data requirement an intent returns that must be fulfilled before it can complete.
  api_resource: /requirements/{requirement_id}
- name: ContributionReport
  description: Periodic report of employee contributions for benefit premiums, with per-employee breakdowns.
  api_resource: /contribution_reports
- name: Event
  description: An immutable record of a state change on another API resource; retrievable for 30 days.
  api_resource: /events
- name: WebhookEndpoint
  description: A registered destination that receives Event objects.
  api_resource: /webhooks/endpoints
- name: EmbedSession
  description: Short-lived token authenticating an employer or employee Embed SDK UI.
  api_resource: /embed/sessions
- name: HostedSession
  description: One-off link into the Kota Hosted benefits experience.
  api_resource: /hosted/sessions

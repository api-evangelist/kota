envelope:
  fields:
  - name: type
    type: string
    description: A URI reference that identifies the problem type.
  - name: title
    type: string
    description: A short, human-readable summary of the problem type.
  - name: status
    type: integer
    description: The HTTP status code for this occurrence of the problem.
  - name: error_code
    type: string
    description: A specific error code representing the error condition.
  - name: trace_id
    type: string
    optional: true
